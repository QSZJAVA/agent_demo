name: Dispatch regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pci-test-only" --health-interval=10s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=12
    env:
      TRACE_IT: 'true'
      P2_IT: 'true'
      TRACE_DB_HOST: 127.0.0.1
      TRACE_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash mvnw test -B
        working-directory: backend
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: backend/target/surefire-reports
