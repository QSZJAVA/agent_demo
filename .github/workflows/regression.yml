name: Dispatch regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pci-test-only" --health-interval=10s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=12
    env:
      TRACE_IT: 'true'
      P2_IT: 'true'
      TRACE_DB_HOST: 127.0.0.1
      TRACE_DB_PASSWORD: ci-test-only
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
      MCP_IT: 'true'
      DEMO_IT: 'false'
      P2_UI: 'false'
      SEMANTIC_LIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/test-deploy.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node tools/check-docs-real-model.cjs
      - run: node tools/check-demo-baseline.cjs
      - run: node tools/check-no-legacy-compat.cjs
      - run: node tools/generate-schema-dictionary.cjs --check
      - run: node tools/check-comments.cjs
      - run: docker compose --env-file .env.example config --quiet
        env:
          LLM_API_KEY: ci-configuration-placeholder
          LLM_MODEL: ci-configuration-placeholder
          BUSINESS_SERVICE_TOKEN: ci-service-configuration-placeholder-32
          AUTH_BOOTSTRAP_PASSWORD: ci-bootstrap-placeholder
      - run: bash backend/mvnw -f pom.xml verify -B
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            backend/target/surefire-reports
            business-service/target/surefire-reports
