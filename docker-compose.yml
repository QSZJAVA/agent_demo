# ============================================================
# 真实模型双服务编排：MySQL + Redis + HTTP MCP 业务服务 + Agent + 前端
# 用法（在项目根目录）：
#   docker compose --env-file .env up -d --build
# 建议直接用 ./deploy.sh up，它会自动生成 .env
# ============================================================

name: report-demo

services:
  mysql:
    image: mysql:8.0
    container_name: report-demo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-report_demo}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [demo-private]

  redis:
    image: redis:7-alpine
    container_name: report-demo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Shanghai
      # 仅供健康检查的 redis-cli 使用；用 REDISCLI_AUTH 而不是 -a，避免密码出现在进程参数里
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [demo-private]

  business-service:
    build:
      context: .
      dockerfile: business-service/Dockerfile
    image: report-demo-business:1.0.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8090"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-report_demo}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BUSINESS_SERVICE_TOKEN: ${BUSINESS_SERVICE_TOKEN:?请设置至少32位的业务服务凭据}
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:-T001}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?请设置初始管理员密码}
    expose: ["8090"]
    networks: [demo-private]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: report-demo-backend:1.0.0
    container_name: report-demo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      business-service:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: real,mcp
      SPRING_FLYWAY_ENABLED: "false"
      SECURITY_ENABLED: "true"
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:-T001}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD}
      BUSINESS_SERVICE_TOKEN: ${BUSINESS_SERVICE_TOKEN}
      BUSINESS_MCP_URL: http://business-service:8090
      # 仅用于没有映射公网端口的 Compose 专网；跨主机接入保留默认 HTTPS 要求。
      BUSINESS_REMOTE_ALLOW_INSECURE_HTTP: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-report_demo}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SEMANTIC_MODE: active
      SEMANTIC_NATIVE_SCHEMA: ${SEMANTIC_NATIVE_SCHEMA:-true}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-}
      SEMANTIC_THINKING_ENABLED: ${SEMANTIC_THINKING_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_ARGS: "--agent.llm.mock=false"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      LLM_API_KEY: ${LLM_API_KEY:?请配置真实模型密钥}
      LLM_MODEL: ${LLM_MODEL:?请填写已验证的模型名称}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -Dfile.encoding=UTF-8}"
    expose:
      - "8080"
    networks: [demo-private, demo-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: report-demo-frontend:1.0.0
    container_name: report-demo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_NAME: ${SERVER_NAME:-_}
    # 应用会话使用 Authorization Bearer；反代保留该请求头。
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$SERVER_NAME' < /etc/nginx/nginx-site.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/nginx-site.conf.template:ro
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    networks: [demo-net]

volumes:
  mysql-data:
  redis-data:

networks:
  demo-private:
    driver: bridge
    internal: true
  demo-net:
    driver: bridge
