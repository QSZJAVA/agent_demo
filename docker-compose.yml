# ============================================================
# 一键编排：MySQL + Redis + 后端 + 前端
# 用法（在项目根目录）：
#   docker compose --env-file .env up -d --build
# 建议直接用 ./deploy.sh up，它会自动生成 .env
# ============================================================

name: report-demo

services:
  mysql:
    image: mysql:8.0
    container_name: report-demo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-report_demo}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [demo-net]

  redis:
    image: redis:7-alpine
    container_name: report-demo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [demo-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: report-demo-backend:2.0.0
    container_name: report-demo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 默认 --spring.profiles.active=mock：走本地关键词模拟模型，不需要 API Key（演示最省事）
      # 接真实大模型时把 SPRING_ARGS 改成空串，并填 LLM_* 三项
      SPRING_ARGS: "${SPRING_ARGS:---spring.profiles.active=mock}"
      # 留空时后端会用 application.yml 里的默认值（自建 OpenAI 兼容站点）
      # 这里不要写 ${VAR:-}，空值会让后端 base-url 解析失败
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      LLM_API_KEY: ${LLM_API_KEY:-sk-no-key-set}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -Dfile.encoding=UTF-8}"
    expose:
      - "8080"
    networks: [demo-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: report-demo-frontend:2.0.0
    container_name: report-demo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
      SERVER_NAME: ${SERVER_NAME:-_}
    # 启动时用环境变量渲染 Nginx 配置，避免把服务器 IP 写死在镜像里
    entrypoint:
      - /bin/sh
      - -c
      - |
        envsubst '$$SERVER_NAME' < /etc/nginx/nginx-site.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/nginx-site.conf.template:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [demo-net]

volumes:
  mysql-data:
  redis-data:

networks:
  demo-net:
    driver: bridge
