# ============================================================
# 一键编排：MySQL + Redis + 后端 + 前端
# 用法（在项目根目录）：
#   docker compose --env-file .env up -d --build
# 建议直接用 ./deploy.sh up，它会自动生成 .env
# ============================================================

name: report-demo

services:
  mysql:
    image: mysql:8.0
    container_name: report-demo-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-report_demo}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [demo-net]

  redis:
    image: redis:7-alpine
    container_name: report-demo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请先在 .env 中设置 REDIS_PASSWORD}
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Shanghai
      # 仅供健康检查的 redis-cli 使用；用 REDISCLI_AUTH 而不是 -a，避免密码出现在进程参数里
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [demo-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: report-demo-backend:2.0.0
    container_name: report-demo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-report_demo}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DEMO_RESET_ON_STARTUP: ${DEMO_RESET_ON_STARTUP:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 默认 --spring.profiles.active=mock：走本地关键词模拟模型，不需要 API Key（演示最省事）
      # 接真实大模型时把 SPRING_ARGS 改成空串，并填 LLM_* 三项
      # 这里必须用 "-" 而不是 ":-"：":-" 会把空串也当成未设置而回落到 mock，deploy.sh start-real 就切不过去
      SPRING_ARGS: "${SPRING_ARGS---spring.profiles.active=mock}"
      # Compose 为未设置或空值提供默认端点/模型，避免传入空 base-url。
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      LLM_API_KEY: ${LLM_API_KEY:-sk-no-key-set}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC -Dfile.encoding=UTF-8}"
    expose:
      - "8080"
    networks: [demo-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: report-demo-frontend:2.0.0
    container_name: report-demo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_NAME: ${SERVER_NAME:-_}
      # 整站 Basic Auth：演示身份只靠请求头，不能不设防地暴露在公网
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-demo}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?请先在 .env 中设置 BASIC_AUTH_PASSWORD}
    # 启动时用环境变量渲染 Nginx 配置与口令文件，避免把服务器 IP、口令写死在镜像里
    # 口令文件只存在于容器内，nginx 的 {PLAIN} 格式无需额外安装 htpasswd/openssl
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$SERVER_NAME' < /etc/nginx/nginx-site.conf.template > /etc/nginx/conf.d/default.conf
        umask 077
        printf '%s:{PLAIN}%s\n' "$$BASIC_AUTH_USER" "$$BASIC_AUTH_PASSWORD" > /etc/nginx/.htpasswd
        chown nginx /etc/nginx/.htpasswd
        exec nginx -g 'daemon off;'
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/nginx-site.conf.template:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [demo-net]

volumes:
  mysql-data:
  redis-data:

networks:
  demo-net:
    driver: bridge
