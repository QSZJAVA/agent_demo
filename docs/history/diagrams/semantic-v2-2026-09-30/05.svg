hor="middle" font-size="13" font-weight="400" fill="#1e354c">返回事实文本与 selection</text><rect x="470" y="2445" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="2485" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">PlanService 创建清单</text><text x="640" y="2505" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">固定预览 + 排除项 + 幂等键</text><text x="640" y="2525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">条数上限 5000；PENDING</text><rect x="470" y="2610" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="2650" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">持久化卡片并 SSE 返回</text><text x="640" y="2670" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">有效预览约 30 分钟</text><text x="640" y="2690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">待确认清单约 10 分钟</text><text x="60" y="2749" font-size="12" fill="#64748b">2026-09-30 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>