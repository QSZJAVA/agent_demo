middle" font-size="13" font-weight="400" fill="#1e354c">每批 500；按 ID 递增</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">业务侧权限和粗筛</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">账号当前权限 + 公司范围</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">租户 / 未派单 / 游标条件</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">Agent 侧当前规则求值</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">具体公司规则优先于通配</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">Aviator Boolean；异常按未命中</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">生成持久化预览</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">超过 5000 → 分批持久化</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">确认最新 requestVersion 后激活</text><rect x="880" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">激活新预览时</text><text x="1050" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">旧 ACTIVE → SUPERSEDED</text><text x="1050" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">旧 PENDING 清单 → EXPIRED</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1330" 