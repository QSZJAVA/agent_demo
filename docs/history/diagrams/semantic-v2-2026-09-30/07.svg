<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="2115" viewBox="0 0 1340 2115" role="img" aria-label="07 状态、SSE 与异常恢复"><defs><marker id="arrow6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">07 状态、SSE 与异常恢复</text><text x="60" y="79" font-size="14" fill="#53697e">V2 多轮依据持久化状态，不依赖模型助手历史。SSE 是业务事件流，不是当前主路径的模型 token 流。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M470,685 L435,685 L435,850 L400,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M810,685 L845,685 L845,850 L880,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M400,850 L435,850 L435,1015 L470,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M880,850 L845,850 L845,1015 L810,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M470,1510 L442,1510 L442,2005 L470,2005" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="425" y="1488" width="62" height="20" fill="white" rx="3"/><text x="456" y="1502" font-size="12" text-anchor="middle" fill="#53697e">正常完成</text><path d="M810,1510 L845,1510 L845,1675 L880,1675" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="790" y="1488" width="75" height="20" fill="white" rx="3"/><text x="827.5" y="1502" font-size="12" text-anchor="middle" fill="#53697e">断线/刷新</text><path d="M880,1675 L845,1675 L845,1840 L810,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,1895 L640,1950" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M470,520 L435,520 L435,1675 L400,1675" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="408.5" y="498" width="88" height="20" fill="white" rx="3"/><text x="452.5" y="512" font-size="12" text-anchor="middle" fill="#53697e">异常/不可靠</text><path d="M400,1675 L435,1675 L435,1180 L470,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M880,2005 L845,2005 L845,1840 L810,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="812" y="1983" width="101" height="20" fill="white" rx="3"/><text x="862.5" y="1997" font-size="12" text-anchor="middle" fill="#53697e">有独立预览任务</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">agent_conversation</text><text x="640" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">会话归属、标题、请求版本</text><text x="640" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">deleted/erasure 拒绝继续写</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">semantic_dialogue 租约</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">默认单轮 180 秒</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">租约 + version CAS；不跨模型持事务</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">模型调用 / 规则扫描</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">阶段之间 check 租约与配额</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">被取消或超时不能提交业务变更</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">fenced() 小事务保存</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">校验 token / version / expiry</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">state_json 脱敏持久化</text><rect x="60" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">semantic_turn</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">脱敏原文、意图、模型</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">结果、原因、耗时、状态版本</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">预览 / 清单 / 条目 / 追溯</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">业务数据和状态持久化</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">更新正文与卡片记录</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">服务端生成事实回复</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">数量、状态、规则来自服务</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不再请求模型润色回答</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SSE 事件</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">conversation / text / preview</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">plan / selection / error / done</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">requestId:seq + 输出脱敏</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">前端按请求/序号校验</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">卡片、文字与选择分别处理</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">前端更新并落地历史恢复线索</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">忽略旧账号/旧会话响应</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">selection 绑定指定 previewId</text><rect x="880" y="1620" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SSE 断开 / 页面刷新</text><text x="1050" y="1680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不保证原文本流续传</text><text x="1050" y="1700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">读取已经保存的业务状态</text><rect x="470" y="1785" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">历史 + card-states + selection</text><text x="640" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">必要时查询持久化 preview job</text><text x="640" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">选择恢复失败先阻止建单</text><rect x="60" y="1620" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="230" y="1660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">错误阶段持久化</text><text x="230" y="1680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">422 → CLARIFY；业务拒绝</text><text x="230" y="1700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">REJECTED；其他异常 FAILED</text><rect x="470" y="1950" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1990" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">新的一轮</text><text x="640" y="2010" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">重新取权威状态/目录</text><text x="640" y="2030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">上一轮禁止仅 THIS_TURN</text><rect x="880" y="1950" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="1980" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">独立异步预览接口</text><text x="1050" y="2000" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">UI/legacy preview_job 可恢复</text><text x="1050" y="2020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">active 语义查询直接调用 PreviewServ</text><text x="1050" y="2040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">ice</text><text x="60" y="2089" font-size="12" fill="#64748b">2026-09-30 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>