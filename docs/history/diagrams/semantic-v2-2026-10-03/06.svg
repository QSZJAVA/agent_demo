idth="36" height="20" fill="white" rx="3"/><text x="640" y="1419.5" font-size="12" text-anchor="middle" fill="#53697e">符合</text><path d="M640,1565 L640,1620" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,1730 L640,1785" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,1895 L640,1950" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,2060 L640,2115" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="583" y="2065.5" width="114" height="20" fill="white" rx="3"/><text x="640" y="2079.5" font-size="12" text-anchor="middle" fill="#53697e">新请求/失败重试</text><path d="M470,2005 L442,2005 L442,2665 L470,2665" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="412" y="1983" width="88" height="20" fill="white" rx="3"/><text x="456" y="1997" font-size="12" text-anchor="middle" fill="#53697e">已成功：重放</text><path d="M470,2005 L442,2005 L442,2665 L470,2665" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="392.5" y="1983" width="127" height="20" fill="white" rx="3"/><text x="456" y="1997" font-size="12" text-anchor="middle" fill="#53697e">协议错误：保守核对</text><path d="M640,2225 L640,2280" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,2390 L640,2445" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,2555 L640,2610" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M400,1510 L435,1510 L435,2665 L470,2665" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M470,2665 L442,2665 L442,1345 L470,1345" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="418.5" y="2643" width="75" height="20" fill="white" rx="3"/><text x="456" y="2657" font-size="12" text-anchor="middle" fill="#53697e">还有下一条</text><path d