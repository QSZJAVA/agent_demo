 x="421.5" y="3468" width="62" height="20" fill="white" rx="3"/><text x="452.5" y="3482" font-size="12" text-anchor="middle" fill="#53697e">全部明确</text><path d="M400,2995 L435,2995 L435,3655 L470,3655" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="347.5" y="2973" width="140" height="20" fill="white" rx="3"/><text x="417.5" y="2987" font-size="12" text-anchor="middle" fill="#53697e">有明确失败且用户要求</text><path d="M470,3655 L442,3655 L442,355 L470,355" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="399" y="3633" width="114" height="20" fill="white" rx="3"/><text x="456" y="3647" font-size="12" text-anchor="middle" fill="#53697e">新任务，原请求号</text><path d="M60,2995 L32,2995 L32,3655 L60,3655" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="15" y="2973" width="62" height="20" fill="white" rx="3"/><text x="46" y="2987" font-size="12" text-anchor="middle" fill="#53697e">无需重试</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow5)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户点击确认卡片</text><text x="640" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">POST /api/dispatch/jobs；不经过模</text><text x="640" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">型</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">归属、权限、TTL、版本复核</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">已 EXECUTED → 返回原结果</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不是有效 PENDING 则拒绝</text><rect x="60" y="795" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">清单不可确认</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">返回当前状态或错误</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">无权限/失效/正在执行等</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">重放已有清单结果</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原状态已 EXECUTED</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">直接返回，不再调用网关</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">CAS 认领执行权</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">确认 PENDING / 重试 EXECUTED</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">→ EXECUTING + executionVersion</text><polygon points="640,1125 810,1180 640,1235 470,1180" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按清单 ID 重读和规则复核</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前记录仍待派单且有权</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">复核失败且未发送可恢复 PENDING</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">逐条是否仍符合？</text><text x="640" y="1360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">取消/过期/失权不能继续</text><rect x="60" y="1455" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="230" y="1505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SKIPPED</text><text x="230" y="1525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">记录已变化；未调用网关</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">先持久化发送意图</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">requestId=planId-itemId</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">条目 UNKNOWN + 审计 INTENT</text><rect x="470" y="1620" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">MCP dispatch_submit</text><text x="640" y="1680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">操作者 / 记录 / 规则模式</text><text x="640" y="1700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原认领执行版本冻结传递</text><polygon points="640,1785 810,1840 640,1895 470,1840" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">业务服务重新读取有效身份</text><text x="640" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">公司、报表权限</text><text x="640" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">锁用户、幂等请求和清单</text><polygon points="640,1950 810,2005 640,2060 470,2005" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1990" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">稳定请求号和负载是否一致？</text><text x="640" y="2010" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同号不同负载 → 拒绝</text><text x="640" y="2030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">已 SUCCESS → 重放成功</text><polygon points="640,2115 810,2170 640,2225 470,2170" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="2155" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">验证已确认清单和条目</text><text x="640" y="2175" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">EXECUTING / confirmedBy</text><text x="640" y="2195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">executionVersion / UNKNOWN 意图</text><rect x="470" y="2280" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="2320" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">原子业务事务复核</text><text x="640" y="2340" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">锁目录、规则和源记录</text><text x="640" y="2360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">版本、规则、当前待派单状态</text><rect x="470" y="2445" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="2485" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">事务提交业务状态与结果</text><text x="640" y="2505" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">业务表状态 + 请求结果同事务</text><text x="640" y="2525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前是本地业务库，非外部 ERP</text><rect x="470" y="2610" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="2650" text-anchor="middle" font-siz