<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1620" viewBox="0 0 1340 1620" role="img" aria-label="04 报表实体解析"><defs><marker id="arrow3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">04 报表实体解析</text><text x="60" y="79" font-size="14" fill="#53697e">词典和模糊算法解决“这段原话对应哪张报表”，不负责整句的否定、动作或追加/排除语义。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M400,355 L435,355 L435,520 L470,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M470,685 L435,685 L435,850 L400,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><rect x="441" y="663" width="23" height="20" fill="white" rx="3"/><text x="452.5" y="677" font-size="12" text-anchor="middle" fill="#53697e">是</text><path d="M810,685 L845,685 L845,850 L880,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><rect x="816" y="663" width="23" height="20" fill="white" rx="3"/><text x="827.5" y="677" font-size="12" text-anchor="middle" fill="#53697e">否</text><path d="M1050,905 L1050,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M880,1015 L845,1015 L845,1180 L810,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M400,850 L435,850 L435,1180 L470,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M470,1345 L435,1345 L435,1510 L400,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><rect x="356.5" y="1323" width="192" height="20" fill="white" rx="3"/><text x="452.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">EXACT/唯一 ALIAS</text><path d="M810,1345 L845,1345 L845,1510 L880,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><rect x="770.5" y="1323" width="114" height="20" fill="white" rx="3"/><text x="827.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">模糊/歧义/未知</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">模型提取的报表原话</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">例如 销售报表 / 应收台账</text><polygon points="230,300 400,355 230,410 60,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="230" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">先限定当前可派单目录</text><text x="230" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同租户 + 已发布/生效/可用</text><text x="230" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">报表权限 + 治理灰度可见</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">TextNormalizer.normalize</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">NFKC + 小写 + 去空白</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">TermIndex 最长不重叠扫描</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">名称 / 编码 / ID / 别名</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">英文词还检查词边界</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">命中词典说法？</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按优先类型关联报表</text><rect x="60" y="795" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">名称 &gt; 编码 &gt; ID &gt; 别名</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">唯一 → EXACT 或 ALIAS</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">一词多报表 → AMBIGUOUS</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">无命中：模糊候选评分</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">编辑距离 / 二元组 Dice</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">包含相似度取最大值</text><polygon points="1050,960 1220,1015 1050,1070 880,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="1050" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">候选评分阈值与领先差</text><text x="1050" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">默认阈值 0.6；歧义差 0.15</text><text x="1050" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">治理策略可提供当前参数</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">ResolveResult</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">EXACT / ALIAS / FUZZY</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">AMBIGUOUS / ALL / NONE</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">V2 Planner 二次收紧</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">只接受可靠唯一链接</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">拒绝 FUZZY、ALL、未识别残片</text><rect x="60" y="1455" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">稳定 reportId</text><text x="230" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按目录顺序合并范围</text><text x="230" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不使用模型直接提供的内部 ID</text><rect x="880" y="1455" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">提示完整名称或候选报表</text><text x="1050" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">用户补充名称或显式 UI 选择</text><text x="1050" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不自动选择最高分候选</text><text x="60" y="1594" font-size="12" fill="#64748b">2026-10-03 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>