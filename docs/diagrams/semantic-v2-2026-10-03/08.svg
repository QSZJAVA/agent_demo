<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1620" viewBox="0 0 1340 1620" role="img" aria-label="08 异步派单任务与恢复"><defs><marker id="arrow7" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">08 异步派单任务与恢复</text><text x="60" y="79" font-size="14" fill="#53697e">确认、明确失败重试、结果核对和手工派单使用持久任务；真实业务服务仍逐项事务复核。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M470,685 L435,685 L435,850 L400,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><rect x="415" y="663" width="75" height="20" fill="white" rx="3"/><text x="452.5" y="677" font-size="12" text-anchor="middle" fill="#53697e">超时未启动</text><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M810,1510 L845,1510 L845,1510 L880,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><rect x="809.5" y="1488" width="36" height="20" fill="white" rx="3"/><text x="827.5" y="1502" font-size="12" text-anchor="middle" fill="#53697e">断线</text><path d="M880,1510 L845,1510 L845,1510 L810,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><rect x="825" y="1488" width="75" height="20" fill="white" rx="3"/><text x="862.5" y="1502" font-size="12" text-anchor="middle" fill="#53697e">仅恢复读取</text><path d="M810,850 L845,850 L845,1180 L880,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><rect x="796.5" y="828" width="62" height="20" fill="white" rx="3"/><text x="827.5" y="842" font-size="12" text-anchor="middle" fill="#53697e">执行中断</text><path d="M1050,1235 L1050,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><path d="M880,1345 L845,1345 L845,1510 L810,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow7)"/><rect x="818.5" y="1323" width="88" height="20" fill="white" rx="3"/><text x="862.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">查看持久状态</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户明确提交操作</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">确认 / 重试 / 核对 / 手工派单</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">先保存稳定任务幂等键</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">POST /api/dispatch/jobs</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">丢失响应时沿用原键</text><polygon points="640,465 810,520 640,575 470,520" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">归属、权限、参数与队列预算</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">冻结清单版本；同清单仅一在途任务</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不经过模型决定是否执行</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">持久化 QUEUED</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">返回任务号；排队最多 10 分钟</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">租户最多 100、用户最多 8 在途任务</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">跨实例认领 RUNNING</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">FOR UPDATE SKIP LOCKED</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">5 分钟租约，30 秒续租</text><rect x="60" y="795" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">未启动即排队过期</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">FAILED；未发送业务请求</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">用户刷新后重新确认</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">重新读身份并复用业务服务</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">确认 / retryFailed / reconcile</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">手工派单持久化逐记录清单</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">真实 HTTP MCP 业务服务</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">冻结原认领 executionVersion</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">稳定请求号、规则和源记录复核</text><rect x="470" y="1290" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">保存可靠业务结果和任务结果</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">SUCCEEDED 是任务完成</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">条目成功/失败以实际结果为准</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">GET /api/dispatch/jobs/{id}</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">前端每秒读取持久任务</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">结果卡片与业务页刷新</text><rect x="880" y="1455" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">页面刷新 / 连接中断</text><text x="1050" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">本机保留任务号和原幂等键</text><text x="1050" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">后台继续，不自动创建新任务</text><rect x="880" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">运行租约过期或执行崩溃</text><text x="1050" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">任务 FAILED，不重新入队</text><text x="1050" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">清单按持久状态恢复或核对</text><polygon points="1050,1290 1220,1345 1050,1400 880,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="1050" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">读取清单与原请求号结果</text><text x="1050" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未知结果必须先核对</text><text x="1050" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">明确失败才允许用户再次重试</text><text x="60" y="1594" font-size="12" fill="#64748b">2026-10-03 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>