<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="2445" viewBox="0 0 1340 2445" role="img" aria-label="02 模型语义解析与校验"><defs><marker id="arrow1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">02 模型语义解析与校验</text><text x="60" y="79" font-size="14" fill="#53697e">模型只负责 action / scopeChanges / restrictions；服务端校验原文证据。应用层最多追加一次解析修复。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M400,355 L435,355 L435,520 L470,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M880,355 L845,355 L845,520 L810,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M470,520 L442,520 L442,850 L470,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1565 L640,1620" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1730 L640,1785" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,1895 L640,1950" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,2060 L640,2115" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="622" y="2065.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="2079.5" font-size="12" text-anchor="middle" fill="#53697e">通过</text><path d="M810,2005 L845,2005 L845,2005 L880,2005" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="796.5" y="1983" width="62" height="20" fill="white" rx="3"/><text x="827.5" y="1997" font-size="12" text-anchor="middle" fill="#53697e">首次失败</text><path d="M880,2005 L845,2005 L845,1180 L810,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="831.5" y="1983" width="62" height="20" fill="white" rx="3"/><text x="862.5" y="1997" font-size="12" text-anchor="middle" fill="#53697e">最多一次</text><path d="M810,2005 L845,2005 L845,2335 L880,2335" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="796.5" y="1983" width="62" height="20" fill="white" rx="3"/><text x="827.5" y="1997" font-size="12" text-anchor="middle" fill="#53697e">再次失败</text><path d="M810,1180 L845,1180 L845,2335 L880,2335" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="777" y="1158" width="101" height="20" fill="white" rx="3"/><text x="827.5" y="1172" font-size="12" text-anchor="middle" fill="#53697e">传输/模型异常</text><path d="M640,2225 L640,2280" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="602.5" y="2230.5" width="75" height="20" fill="white" rx="3"/><text x="640" y="2244.5" font-size="12" text-anchor="middle" fill="#53697e">再校验通过</text><path d="M810,2170 L845,2170 L845,2335 L880,2335" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="790" y="2148" width="75" height="20" fill="white" rx="3"/><text x="827.5" y="2162" font-size="12" text-anchor="middle" fill="#53697e">再校验失败</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">本轮原始 message</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原文进入受信任服务边界</text><rect x="60" y="300" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="230" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">权威上下文</text><text x="230" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">desired / effective / phase</text><text x="230" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未解状态、排除数、上次 action</text><rect x="880" y="300" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">权限过滤后的报表候选</text><text x="1050" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">ReportRef + mentionedReportTerms</text><text x="1050" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">词典命中只提供实体线索</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SensitiveData.modelText</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">手机号 / 证件号 / 邮箱</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">替换为本轮随机 REF 占位符</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">构造 JSON 输入</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">currentMessage + context</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不带完整助手历史或业务明细</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">构造真实模型调用</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">temperature 0；maxTokens 2400</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">禁用内部工具执行和回调</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">规则提示 + V2 JSON Schema</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">native-schema 默认关闭；按端点验证</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">模型名由实际模型配置提供</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">同步 call().content()</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">只取完整 JSON 内容</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">模型不能实际派单或编写 SQL</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">IntentCodec 严格解码</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">version=2；必填/类型/枚举</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未知字段和尾随内容拒绝</text><polygon points="640,1455 810,1510 640,1565 470,1510" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">验证原文证据和协议不变量</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">evidence 归一化后属于原文</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">mentions 属于 evidence</text><polygon points="640,1620 810,1675 640,1730 470,1675" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">检查动作、顺序和限制</text><text x="640" y="1680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">公司仅一次 REPLACE/CLEAR</text><text x="640" y="1700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">记录修改在后；动作禁止不冲突</text><polygon points="640,1785 810,1840 640,1895 470,1840" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">报表实体覆盖检查</text><text x="640" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">查询类输出必须覆盖</text><text x="640" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">本轮所有已命中的报表候选</text><polygon points="640,1950 810,2005 640,2060 470,2005" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="2000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">所有检查通过？</text><text x="640" y="2020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">JSON / 原文 / 报表覆盖</text><rect x="880" y="1950" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="1050" y="1990" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">第一次失败：独立重解析</text><text x="1050" y="2010" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同一本轮输入 + 修复指令</text><text x="1050" y="2030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不采用模型猜测或关键词兜底</text><rect x="880" y="2280" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="2320" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">第二次失败 / 调用异常</text><text x="1050" y="2340" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">返回友好原因与未解状态</text><text x="1050" y="2360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">传输异常不走格式修复循环</text><rect x="470" y="2115" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="2155" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">恢复 REF 到本地原实体</text><text x="640" y="2175" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">恢复 mentions / evidence</text><text x="640" y="2195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">在原 message 上再次校验</text><rect x="470" y="2280" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="2320" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">交付 SemanticIntent</text><text x="640" y="2340" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">Source=MODEL</text><text x="640" y="2360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">交给 Planner，不调用业务工具</text><text x="60" y="2419" font-size="12" fill="#64748b">2026-10-03 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>