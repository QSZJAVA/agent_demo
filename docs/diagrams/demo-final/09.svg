<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1455" viewBox="0 0 1340 1455" role="img" aria-label="09 通用查询与连续上下文"><defs><marker id="arrow8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">09 通用查询与连续上下文</text><text x="60" y="79" font-size="14" fill="#53697e">真实模型只生成受控查询；业务数据查询不替代派单候选，也不改变已有勾选。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><rect x="622" y="580.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">只读</text><path d="M575,575 L575,602.5 L230,602.5 L230,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><rect x="384.5" y="580.5" width="36" height="20" fill="white" rx="3"/><text x="402.5" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">派单</text><path d="M705,575 L705,602.5 L1050,602.5 L1050,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><rect x="853" y="580.5" width="49" height="20" fill="white" rx="3"/><text x="877.5" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">不确定</text><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><path d="M810,1015 L845,1015 L845,685 L880,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow8)"/><rect x="807.5" y="828" width="75" height="20" fill="white" rx="3"/><text x="845" y="842" font-size="12" text-anchor="middle" fill="#53697e">失败或超限</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">自然语言或分页请求</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">报表数据 / 派单记录 / 工单</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">会话租约与当前权限</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">请求归属、配额、历史权限版本</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">ModelAssistantPlanner · MODEL</text><text x="640" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">授权字段、查询引用、持续业务焦点</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">派单语义子流程</text><text x="230" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">尝试普通查询后先重查派单候选</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">AssistantCodec / BusinessQuery</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">严格类型、条件、排序、页码及预算</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">帮助 / 澄清 / 拒绝</text><text x="1050" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不丢弃不支持条件、不执行写入</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">HTTP MCP business_query</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">服务端身份、租户、公司、报表权限</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">完整受限读取与确定性统计</text><text x="640" y="1030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">全部报表状态 / 派单归属 / 工单接口</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">持久查询卡片与独立上下文</text><text x="640" y="1195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">完整总数、分币种金额、时点和来源</text><rect x="470" y="1290" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">列表、详情、总结与翻页</text><text x="640" y="1360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">刷新可恢复；权限变化阻止旧事实展示</text><text x="60" y="1429" font-size="12" fill="#64748b">2026-10-06 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>