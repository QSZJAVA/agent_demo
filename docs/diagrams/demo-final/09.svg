 · MODEL</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">成功查询、展示行、完整性和焦点</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">撤销条件须有本轮原文证据</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">派单语义子流程</text><text x="230" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">尝试普通查询后先重查派单候选</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">AssistantCodec / BusinessQuery</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">路由/范围/追问与条件保留校验</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">帮助 / 澄清 / 拒绝</text><text x="1050" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不丢弃不支持条件、不执行写入</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">HTTP MCP business_query</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">真实只读草稿预检及当前授权</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">完整受限读取与确定性统计</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">10万行 / 120秒 / 16MiB</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c