<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1290" viewBox="0 0 1340 1290" role="img" aria-label="07 异常调查与证据"><defs><marker id="arrow6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">07 异常调查与证据</text><text x="60" y="79" font-size="14" fill="#53697e">调查为独立只读流程，不修改派单选择、清单或来源数据。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><path d="M470,1015 L442,1015 L442,520 L470,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="417.5" y="745.5" width="49" height="20" fill="white" rx="3"/><text x="442" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">下一步</text><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow6)"/><rect x="589.5" y="1075.5" width="101" height="20" fill="white" rx="3"/><text x="640" y="1089.5" font-size="12" text-anchor="middle" fill="#53697e">结束或预算边界</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户显式发起异常调查</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">登记调查运行与租约</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">任务预算、取消及恢复</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">有界上下文与证据索引</text><text x="640" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前授权目录、步骤与已验证证据</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">真实模型提出只读工具请求</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">应用控制执行循环与调用预算</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">参数与权限校验后调用</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">六个受控只读工具 / HTTP MCP</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">出站消息统一脱敏，配对ID保留</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">保存步骤、事实与引用</text><text x="640" y="1030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">缺失事实不能编造为结论</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">证据支持的调查报告</text><text x="640" y="1195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">覆盖不足明确说明，不触发派单</text><text x="60" y="1264" font-size="12" fill="#64748b">2026-10-06 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>