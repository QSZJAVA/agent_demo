x="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">我的任务与站内提醒</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">清单、派单、异常、调查、导出</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按状态去重与已读，只恢复所选任务</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">待确认清单与原执行状态机</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">仍须显式确认；核对不盲目重发</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前权限、规则、字段及执行版本保护</text><polygon points="230,960 400,1015 230,1070 60,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="230" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">统一读取与失效边界</text><text x="230" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">撤权、口径变更、过期、缺行拒绝</text><text x="230" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">历史运行数据不迁移</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-12 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>