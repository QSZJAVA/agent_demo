<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1125" viewBox="0 0 1340 1125" role="img" aria-label="12 运营治理与展示口径"><defs><marker id="arrow11" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">12 运营治理与展示口径</text><text x="60" y="79" font-size="14" fill="#53697e">页面中文化只影响展示；指标、业务授权、策略版本和审计事实以服务端为准。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M575,388.97058823529414 L575,437.5 L230,437.5 L230,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><rect x="384.5" y="415.5" width="36" height="20" fill="white" rx="3"/><text x="402.5" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">指标</text><path d="M705,388.97058823529414 L705,437.5 L1050,437.5 L1050,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><rect x="846.5" y="415.5" width="62" height="20" fill="white" rx="3"/><text x="877.5" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">治理操作</text><path d="M230,575 L230,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M230,740 L230,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M1050,575 L1050,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M1050,740 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M295,883.9705882352941 L295,932.5 L640,932.5 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><path d="M985,905 L985,932.5 L640,932.5 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow11)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">运营治理入口</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">管理员菜单与六个功能页签</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">当前管理员及租户校验</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">任务处理另核对清单业务范围</text><rect x="60" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">业务指标完整汇总</text><text x="230" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">最近1 / 7 / 30 / 90天</text><text x="230" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">解析请求与当前派单条目分母</text><rect x="880" y="465" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">工作台 / 策略 / 留存</text><text x="1050" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">核对、重试、关闭须提供原因</text><text x="1050" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">策略保存与回滚带期望版本</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="230" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">中文环节、报表和状态</text><text x="230" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">明细最多1000组，每页20组</text><text x="230" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">中文搜索不改变顶部比例</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按动作提交并复核</text><text x="1050" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">核对重试进入持久任务</text><text x="1050" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">其他管理操作由专用接口处理</text><polygon points="230,795 400,850 230,905 60,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">已执行不等于全部成功</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">无样本显示暂无数据</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">95%耗时单位为毫秒</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">访问审计与恢复依据</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">记录操作者、动作和结果</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原始资源标识保留可查</text><polygon points="640,960 810,1015 640,1070 470,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">证据范围分别说明</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">名称解析评估不是模型准确率</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">指标不是生产容量或SLA验收</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-07 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>