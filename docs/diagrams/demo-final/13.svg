<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="960" viewBox="0 0 1340 960" role="img" aria-label="13 语义质量与业务词典"><defs><marker id="arrow12" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">13 语义质量与业务词典</text><text x="60" y="79" font-size="14" fill="#53697e">按公司、报表和数据域发布；编辑与澄清继续完整复核；缺失计量明确未知。</text><path d="M230,245 L230,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M230,410 L230,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M400,520 L435,520 L435,520 L470,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M810,520 L845,520 L845,520 L880,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M1050,575 L1050,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><path d="M1050,740 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow12)"/><rect x="60" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="230" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">管理员维护业务词典</text><text x="230" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">名称、字段、单位、枚举及日历</text><polygon points="230,300 400,355 230,410 60,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="230" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">当前授权与类型校验</text><text x="230" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">范围、冲突及读取时版本</text><rect x="60" y="465" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="230" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">发布定义与版本历史</text><text x="230" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">递增目录版本，旧执行对象失效</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户本轮明确请求</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">自然语言、完整条件编辑或候选选择</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">会话租约与当前引用</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">拒绝过期卡片、权限或词典变化</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">目标、规划与独立复核 → MODEL</text><text x="640" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同一授权词典及参考时刻</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">完整语义与业务预检</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保留AND/OR及用户选择</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">发布前再次核对权限和词典</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">条件解释与澄清卡片</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">最新引用可操作，刷新恢复快照</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">仍须另行确认派单</text><rect x="880" y="465" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">可靠会话阶段诊断</text><text x="1050" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">耗时、修正及有效原生用量</text><text x="1050" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不保存原始模型输入输出</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">本人诊断与幂等反馈</text><text x="1050" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前权限过滤，反馈待审核</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">版本化语料与独立事实评分</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保存每次失败和版本差异</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">预留工程语料不冒称业务盲测</text><text x="60" y="934" font-size="12" fill="#64748b">2026-10-12 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>