<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1125" viewBox="0 0 1340 1125" role="img" aria-label="11 手工派单与记录详情"><defs><marker id="arrow10" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">11 手工派单与记录详情</text><text x="60" y="79" font-size="14" fill="#53697e">报表页选择、确认和持久任务不经过模型；记录抽屉与对话查询入口各自保留范围。</text><path d="M575,245 L575,272.5 L230,272.5 L230,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><rect x="371.5" y="250.5" width="62" height="20" fill="white" rx="3"/><text x="402.5" y="264.5" font-size="12" text-anchor="middle" fill="#53697e">发起派单</text><path d="M705,245 L705,272.5 L1050,272.5 L1050,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><rect x="846.5" y="250.5" width="62" height="20" fill="white" rx="3"/><text x="877.5" y="264.5" font-size="12" text-anchor="middle" fill="#53697e">查看记录</text><path d="M230,410 L230,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><path d="M230,575 L230,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><path d="M1050,410 L1050,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><path d="M1050,575 L1050,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><path d="M400,685 L435,685 L435,520 L880,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><rect x="404" y="580.5" width="62" height="20" fill="white" rx="3"/><text x="435" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">结果刷新</text><path d="M1050,740 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><rect x="999.5" y="745.5" width="101" height="20" fill="white" rx="3"/><text x="1050" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">按需查看或处理</text><path d="M985,740 L985,767 L834,767 L834,1015 L810,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><path d="M985,905 L985,932.5 L640,932.5 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow10)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">报表页业务明细</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">授权范围分页；金额为本页合计</text><rect x="60" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="230" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">勾选当前页未派单记录</text><text x="230" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">每次1～50条，核对后确认</text><rect x="880" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">右上角“派单记录”</text><text x="1050" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">独立抽屉，每页最多50条</text><text x="1050" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">仅当前用户、当前报表手工记录</text><rect x="60" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">DIRECT持久任务</text><text x="230" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">稳定幂等键、权限与版本校验</text><text x="230" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">每条记录生成可追溯清单</text><rect x="880" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">读取服务器记录</text><text x="1050" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">加载错误可刷新，未知先核对</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="230" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">认证HTTP MCP执行</text><text x="230" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">来源行锁、字段快照和原请求号</text><text x="230" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">持久结果回到报表与记录抽屉</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">展开详情 / 收起详情</text><text x="1050" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">文字按钮或箭头所在整格</text><text x="1050" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按planId保留同页刷新展开状态</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">完整追溯 / 按状态处理</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">事件、审计、会话、逐条结果</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">待核对先查；明确失败才重试</text><polygon points="640,960 810,1015 640,1070 470,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">详情切换仅改变本地显示</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">关闭抽屉不取消后台任务</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">业务动作继续走原保护链路</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-07 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>