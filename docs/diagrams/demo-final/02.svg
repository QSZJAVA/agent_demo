<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1125" viewBox="0 0 1340 1125" role="img" aria-label="02 模型解析与校验"><defs><marker id="arrow1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">02 模型解析与校验</text><text x="60" y="79" font-size="14" fill="#53697e">模型不生成SQL或执行请求；脱敏草稿加汇总诊断辅助唯一一次结构修正。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M470,685 L435,685 L435,685 L400,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="663" width="62" height="20" fill="white" rx="3"/><text x="435" y="677" font-size="12" text-anchor="middle" fill="#53697e">首次失败</text><path d="M400,685 L435,685 L435,520 L470,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="622" y="745.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">合格</text><path d="M470,850 L435,850 L435,685 L400,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="745.5" width="62" height="20" fill="white" rx="3"/><text x="435" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">首次矛盾</text><path d="M705,718.9705882352941 L705,767.5 L1050,767.5 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="846.5" y="745.5" width="62" height="20" fill="white" rx="3"/><text x="877.5" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">再次失败</text><path d="M810,850 L845,850 L845,850 L880,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="814" y="828" width="62" height="20" fill="white" rx="3"/><text x="845" y="842" font-size="12" text-anchor="middle" fill="#53697e">业务拒绝</text><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="622" y="910.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">合格</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">本轮用户原话</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">查询、记录选择或生成清单</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">构造有界受控上下文</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前状态、授权报表及字段元数据</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">ModelIntentParser → MODEL</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">V1 Schema、稳定规则与抽象对照</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">明确凭据阻断、上下文统一脱敏</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">IntentCodec 校验</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">结构、类型、原文证据、禁止条件</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="230" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">最多一次修正</text><text x="230" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">将具体校验错误交回模型</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SemanticPlanner 草稿校验</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">覆盖、实体角色与范围一致性</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">澄清 / 拒绝 / 失败</text><text x="1050" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不提交部分选择、不自动建单</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">确定性业务流程</text><text x="640" y="1030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">范围 → 快照 → 选择 → 待确认清单</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-06 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>