<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1620" viewBox="0 0 1340 1620" role="img" aria-label="02 统一任务规划与语义复核"><defs><marker id="arrow1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">02 统一任务规划与语义复核</text><text x="60" y="79" font-size="14" fill="#53697e">先校验当前焦点、目标、数据域与最终总数，再分别规划和复核；最多三次规划、三次独立判断（含目标重试）。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="622" y="910.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">合格</text><path d="M575,883.9705882352941 L575,932.5 L230,932.5 L230,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="358.5" y="910.5" width="88" height="20" fill="white" rx="3"/><text x="402.5" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">结构不可解析</text><path d="M705,883.9705882352941 L705,932 L856,932 L856,1180 L880,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="736.5" y="910" width="88" height="20" fill="white" rx="3"/><text x="780.5" y="924" font-size="12" text-anchor="middle" fill="#53697e">拒绝或超预算</text><path d="M810,1015 L845,1015 L845,1015 L880,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M985,1048.9705882352941 L985,1097.5 L640,1097.5 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="775" y="1075.5" width="75" height="20" fill="white" rx="3"/><text x="812.5" y="1089.5" font-size="12" text-anchor="middle" fill="#53697e">仅词义线索</text><path d="M705,1048.9705882352941 L705,1097.5 L1050,1097.5 L1050,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="807.5" y="1075.5" width="140" height="20" fill="white" rx="3"/><text x="877.5" y="1089.5" font-size="12" text-anchor="middle" fill="#53697e">权限/版本/服务故障</text><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="589.5" y="1240.5" width="101" height="20" fill="white" rx="3"/><text x="640" y="1254.5" font-size="12" text-anchor="middle" fill="#53697e">要求与完整期望</text><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="583" y="1405.5" width="114" height="20" fill="white" rx="3"/><text x="640" y="1419.5" font-size="12" text-anchor="middle" fill="#53697e">契约与语义均通过</text><path d="M470,1345 L435,1345 L435,1015 L400,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="1158" width="62" height="20" fill="white" rx="3"/><text x="435" y="1172" font-size="12" text-anchor="middle" fill="#53697e">修正草稿</text><path d="M810,1345 L845,1345 L845,1180 L880,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="814" y="1240.5" width="62" height="20" fill="white" rx="3"/><text x="845" y="1254.5" font-size="12" text-anchor="middle" fill="#53697e">预算耗尽</text><path d="M470,1345 L435,1345 L435,1345 L400,1345" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="1323" width="62" height="20" fill="white" rx="3"/><text x="435" y="1337" font-size="12" text-anchor="middle" fill="#53697e">复核无效</text><path d="M400,1345 L435,1345 L435,1180 L470,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="1240.5" width="62" height="20" fill="white" rx="3"/><text x="435" y="1254.5" font-size="12" text-anchor="middle" fill="#53697e">修正复核</text><path d="M400,1015 L435,1015 L435,685 L470,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="404" y="828" width="62" height="20" fill="white" rx="3"/><text x="435" y="842" font-size="12" text-anchor="middle" fill="#53697e">重新规划</text><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="609" y="580.5" width="62" height="20" fill="white" rx="3"/><text x="640" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">有效目标</text><path d="M705,575 L705,602 L856,602 L856,1180 L880,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="749.5" y="580" width="62" height="20" fill="white" rx="3"/><text x="780.5" y="594" font-size="12" text-anchor="middle" fill="#53697e">目标无效</text><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow1)"/><rect x="596" y="1075.5" width="88" height="20" fill="white" rx="3"/><text x="640" y="1089.5" font-size="12" text-anchor="middle" fill="#53697e">独立完整期望</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">本轮完整任务</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">查询、资格核验或待确认派单</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">构造有界受控上下文</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">授权目录、真实对话与可靠对象</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">授权报表原词与完整任务契约</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">统一任务规划 → MODEL</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">AssistantPlan + DispatchDirective</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原生 Schema、thinking 关闭</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">严格结构解析</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">字段、类型和枚举，拒绝不可解析输出</text><rect x="60" y="960" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="230" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">最多两次草稿修正</text><text x="230" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保留累计草稿、事实及全部差异</text><text x="230" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">合法独立期望保持不变</text><polygon points="640,960 810,1015 640,1070 470,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">程序约束与只读业务预检</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">身份、原文、范围及当前业务事实</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保留契约错误，不应用草稿</text><polygon points="1050,960 1220,1015 1050,1070 880,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="1050" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">原文命中的字段词义</text><text x="1050" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">授权字符串字段值，最多64项</text><text x="1050" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不提供行身份、草稿或结果全集</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">独立判断目标 → MODEL</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">结果、数据域、查询承接及最终总数</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">核对当前焦点，自身可修正一次</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">独立语义复核 → MODEL</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原文、受控上下文与词义线索</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">完整期望、新条件来源及旧条件变化</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">校验期望、比较任务与数量</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">新旧条件逐项核对 / 端点与本轮依据</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">固定独立总数，漏填与不足同时反馈</text><rect x="60" y="1290" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="230" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">修复复核自身</text><text x="230" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同时修复前提与证据，不改草稿</text><text x="230" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">与目标判断共用整轮三次预算</text><rect x="880" y="1125" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">澄清 / 拒绝 / 失败</text><text x="1050" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保留原候选和清单</text><text x="1050" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">失败原因留存供后续恢复</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按已复核任务执行</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">只应用已校验的操作字段</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">澄清可采用已复核表达</text><text x="60" y="1594" font-size="12" fill="#64748b">2026-10-10 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>