<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1125" viewBox="0 0 1340 1125" role="img" aria-label="03 配置字段与实体选择"><defs><marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">03 配置字段与实体选择</text><text x="60" y="79" font-size="14" fill="#53697e">筛选只在完整授权快照内执行；报表限定不等于替换查询范围。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M575,388.97058823529414 L575,437.5 L230,437.5 L230,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="371.5" y="415.5" width="62" height="20" fill="white" rx="3"/><text x="402.5" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">字段条件</text><path d="M705,388.97058823529414 L705,437.5 L1050,437.5 L1050,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="846.5" y="415.5" width="62" height="20" fill="white" rx="3"/><text x="877.5" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">实体选择</text><path d="M230,575 L230,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M1050,575 L1050,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M295,718.9705882352941 L295,767.5 L640,767.5 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M985,718.9705882352941 L985,767.5 L640,767.5 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="609" y="910.5" width="62" height="20" fill="white" rx="3"/><text x="640" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">全部成功</text><path d="M705,883.9705882352941 L705,932.5 L1050,932.5 L1050,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="859.5" y="910.5" width="36" height="20" fill="white" rx="3"/><text x="877.5" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">失败</text><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="609" y="415.5" width="62" height="20" fill="white" rx="3"/><text x="640" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">已有引用</text><path d="M470,520 L442,520 L442,850 L470,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">RECORDS 操作</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">EXCLUDE / RESTORE / KEEP_ONLY等</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按 reportMentions 限定记录</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">校验报表权限及当前预览</text><rect x="60" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">FIELDS 条件编译</text><text x="230" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">目录字段白名单、类型、允许操作</text><rect x="880" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">单据 / 摘要 / 客户 / 整类</text><text x="1050" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">DOCUMENT / DESCRIPTION</text><text x="1050" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">COUNTERPARTY / ALL</text><polygon points="230,630 400,685 230,740 60,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="230" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">有界AND / OR条件求值</text><text x="230" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">各报表按已声明字段匹配</text><text x="230" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未声明字段不当作业务空值</text><polygon points="1050,630 1220,685 1050,740 880,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="1050" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">实体、数量与整类操作校验</text><text x="1050" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">多客户歧义不能用全部绕过</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">完整快照及整轮原子性</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">任一项失败不提交部分排除</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">更新复合记录键集合</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">仅更新当前授权报表子集</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">只保留须有明确排他依据</text><rect x="880" y="960" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">未知字段 / 歧义 / 缺失事实</text><text x="1050" y="1030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">明确提示并保留恢复路径</text><polygon points="640,465 810,520 640,575 470,520" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">REFERENCE 当前预览引用</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">绑定预览及复合记录标识</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">核对本轮点名冲突与数量</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-07 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>