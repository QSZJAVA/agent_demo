050,740 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><path d="M880,850 L845,850 L845,850 L810,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow3)"/><rect x="814" y="828" width="62" height="20" fill="white" rx="3"/><text x="845" y="842" font-size="12" text-anchor="middle" fill="#53697e">明确纠正</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">desired 与 effective 分开</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">通过预检的范围 / 最近成功范围</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">范围相同且预览有效？</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">纯记录操作复用原预览</text><rect x="60" y="465" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="230" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按权限与规则查询</text><text x="230" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">范围扫描或绑定精确目标读取</text><text x="230" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">异常整次失败，保留旧预览/清单</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">冻结预览</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">客户实体 + FieldFact 字段快照</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">精确目标和原查询引用随快照冻结</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">选择绑定预览ID与记录键</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">预览权限校验 + 手动选择CAS保存</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">只保留须排他限定；不动须UNCHANGED</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">未完成请求独立标记</text><text x="1050" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不污染已确定公司与报表</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">明确新操作可继续</text><text x="1050" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">含糊的直接建单仍被阻止</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">刷新 / 重启 / 会话恢复</text><text x="640" y="1030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">重读权威状态，不重新猜选择</text><text x="60" y="1099" font-size="12" fill="#64748b">2026-10-10 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>