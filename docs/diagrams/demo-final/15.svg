 height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">受控计算与知识检索</text><text x="640" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">完整统计、精确金额、稳定排名</text><text x="640" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">明细展开仅使用同一来源快照</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="1050" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">认证HTTP MCP读取</text><text x="1050" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">公司、租户与报表逐次授权</text><text x="1050" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不同基础查询各有观测时间</text><rect x="60" y="795" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="230" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">取消、失租或依据变化</text><text x="230" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">撤销令牌，拒绝迟到结果</text><text x="230" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不自动重放模型或业务写入</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">持久计划、步骤与实际用量</text><text x="640" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">请求号幂等，展示完整性边界</text><text x="640" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">失败与已完成步骤分别保留</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">P1完整不可变快照</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight