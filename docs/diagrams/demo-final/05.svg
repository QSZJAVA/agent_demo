<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1455" viewBox="0 0 1340 1455" role="img" aria-label="05 确认与持久执行任务"><defs><marker id="arrow4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">05 确认与持久执行任务</text><text x="60" y="79" font-size="14" fill="#53697e">自然语言只生成PENDING清单；用户确认通过独立REST任务入口。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow4)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">生成待确认清单</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">复制字段与客户快照、固定排除项</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户核对并点击确认</text><text x="640" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">持久任务 + 稳定幂等键</text><polygon points="640,465 810,520 640,575 470,520" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">归属、权限、TTL、版本</text><text x="640" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按租户认领并冻结执行版本</text><rect x="470" y="630" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">逐条持久化发送意图</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">稳定requestId、UNKNOWN及审计</text><rect x="470" y="795" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">dispatch_submit</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">服务认证与用户当前权限</text><polygon points="640,960 810,1015 640,1070 470,1015" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">业务事务与锁定复核</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">行锁内复核全部确认字段及版本</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">字段变化要求重新查询确认</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">原子提交状态与请求结果</text><text x="640" y="1195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">相同请求号及负载可重放</text><rect x="470" y="1290" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">持久结果回到页面</text><text x="640" y="1360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">刷新与断线不导致重新派单</text><text x="60" y="1429" font-size="12" fill="#64748b">2026-10-10 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>