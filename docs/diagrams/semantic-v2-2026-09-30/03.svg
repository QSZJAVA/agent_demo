<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="2115" viewBox="0 0 1340 2115" role="img" aria-label="03 多轮范围与动作规划"><defs><marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">03 多轮范围与动作规划</text><text x="60" y="79" font-size="14" fill="#53697e">desired 是请求范围，effective 是最近成功范围；拒绝的新输入不会被悄悄替换为旧的成功查询。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="622" y="415.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="429.5" font-size="12" text-anchor="middle" fill="#53697e">允许</text><path d="M810,355 L845,355 L845,1840 L880,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="803" y="333" width="49" height="20" fill="white" rx="3"/><text x="827.5" y="347" font-size="12" text-anchor="middle" fill="#53697e">需澄清</text><path d="M470,520 L435,520 L435,685 L400,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M810,520 L845,520 L845,685 L880,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M400,685 L435,685 L435,1015 L470,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M1050,740 L1050,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M880,850 L845,850 L845,1015 L810,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="831.5" y="828" width="62" height="20" fill="white" rx="3"/><text x="862.5" y="842" font-size="12" text-anchor="middle" fill="#53697e">全部成功</text><path d="M880,850 L852,850 L852,1180 L880,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="841.5" y="828" width="49" height="20" fill="white" rx="3"/><text x="866" y="842" font-size="12" text-anchor="middle" fill="#53697e">不可靠</text><path d="M470,520 L435,520 L435,1015 L400,1015" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="408.5" y="498" width="88" height="20" fill="white" rx="3"/><text x="452.5" y="512" font-size="12" text-anchor="middle" fill="#53697e">跳过记录操作</text><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="602.5" y="1240.5" width="75" height="20" fill="white" rx="3"/><text x="640" y="1254.5" font-size="12" text-anchor="middle" fill="#53697e">有权且明确</text><path d="M810,1180 L845,1180 L845,1840 L880,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="809.5" y="1158" width="36" height="20" fill="white" rx="3"/><text x="827.5" y="1172" font-size="12" text-anchor="middle" fill="#53697e">拒绝</text><path d="M880,1180 L852,1180 L852,1840 L880,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M470,1345 L435,1345 L435,1510 L400,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="415" y="1323" width="75" height="20" fill="white" rx="3"/><text x="452.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">查询/规则</text><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="622" y="1405.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="1419.5" font-size="12" text-anchor="middle" fill="#53697e">建单</text><path d="M810,1345 L845,1345 L845,1510 L880,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="809.5" y="1323" width="36" height="20" fill="white" rx="3"/><text x="827.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">辅助</text><path d="M400,1510 L435,1510 L435,1675 L470,1675" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M640,1565 L640,1620" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M880,1510 L845,1510 L845,2005 L810,2005" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M470,1675 L442,1675 L442,2005 L470,2005" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><path d="M880,1840 L845,1840 L845,2005 L810,2005" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow2)"/><rect x="470" y="135" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">读取 DialogueState</text><text x="640" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按会话、租户、操作者归属</text><text x="640" y="215" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">hydrate 新的显式 UI 预览</text><polygon points="640,300 810,355 640,410 470,355" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">requireCoverage / requireAction</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">CLARIFY 或禁止冲突立即阻断</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">对应字段置 unresolved</text><rect x="470" y="465" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">在临时 draft 上合并</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按 scopeChanges 原始顺序</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">全部公司/报表操作成功才提交</text><rect x="60" y="630" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">COMPANY</text><text x="230" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">REPLACE：NFKC/去公司后缀/大写</text><text x="230" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">CLEAR：全部可见公司</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">REPORTS</text><text x="1050" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">REPLACE / ADD / REMOVE / CLEAR</text><text x="1050" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">原话逐项映射到 reportId</text><rect x="60" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="230" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">RECORDS 暂不应用</text><text x="230" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">留到最终范围的预览完成</text><text x="230" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">详见第 05 页</text><polygon points="1050,795 1220,850 1050,905 880,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">报表链接必须可靠</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">EXACT/唯一 ALIAS 可继续</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">FUZZY/AMBIGUOUS/NONE 需澄清</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">提交 desired 范围</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未提及字段保持不变</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">清除已解决字段的未解标记</text><rect x="880" y="1125" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">任一合并失败</text><text x="1050" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不提交部分 draft</text><text x="1050" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">相关 unresolved 标记保留</text><polygon points="640,1125 810,1180 640,1235 470,1180" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">执行前 validate desired</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">公司范围、报表可用与权限</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">移除后为空 / 未解字段拒绝</text><polygon points="640,1290 810,1345 640,1400 470,1345" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">按 action 分支</text><text x="640" y="1360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">语义层没有 EXECUTE 动作</text><rect x="60" y="1455" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="230" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">PREVIEW / EXPLAIN_RULES</text><text x="230" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">刷新或复用预览</text><text x="230" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">规则说明来自实际预览</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">PREPARE_DISPATCH</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">复用或刷新相同范围预览</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">恢复选择后生成 PENDING</text><rect x="880" y="1455" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">HELP / CANCEL / SHOW_RESULT</text><text x="1050" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">服务端文本或当前清单</text><text x="1050" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不靠模型生成业务结论</text><rect x="470" y="1620" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">仅查询成功后更新 effective</text><text x="640" y="1680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">previewId 对应成功数据范围</text><text x="640" y="1700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">建单成功更新 planId/PLAN_READY</text><rect x="880" y="1785" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="1050" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">失败记录 phase 和 lastReason</text><text x="1050" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">422 → CLARIFY；其他业务拒绝</text><text x="1050" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">基础设施异常 → FAILED</text><rect x="470" y="1950" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="1990" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">下一轮继续</text><text x="640" y="2010" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">这些/剩下的参考权威状态</text><text x="640" y="2030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">未解条件不能沿用旧数据建单</text><text x="60" y="2089" font-size="12" fill="#64748b">2026-09-30 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>