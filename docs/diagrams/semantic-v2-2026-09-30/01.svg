<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="3105" viewBox="0 0 1340 3105" role="img" aria-label="01 输入到业务的总流程"><defs><marker id="arrow0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#657891"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif"><text x="60" y="44" font-size="26" font-weight="700" fill="#15334b">01 输入到业务的总流程</text><text x="60" y="79" font-size="14" fill="#53697e">当前 active V2 主路径；自然语言生成清单与用户确认执行是两次独立交互。</text><path d="M640,245 L640,300" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M640,410 L640,465" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M810,520 L845,520 L845,520 L880,520" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="809.5" y="498" width="36" height="20" fill="white" rx="3"/><text x="827.5" y="512" font-size="12" text-anchor="middle" fill="#53697e">失效</text><path d="M640,575 L640,630" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="622" y="580.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="594.5" font-size="12" text-anchor="middle" fill="#53697e">有效</text><path d="M810,685 L845,685 L845,685 L880,685" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="803" y="663" width="49" height="20" fill="white" rx="3"/><text x="827.5" y="677" font-size="12" text-anchor="middle" fill="#53697e">不合法</text><path d="M640,740 L640,795" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="622" y="745.5" width="36" height="20" fill="white" rx="3"/><text x="640" y="759.5" font-size="12" text-anchor="middle" fill="#53697e">合法</text><path d="M810,850 L845,850 L845,850 L880,850" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="783.5" y="828" width="88" height="20" fill="white" rx="3"/><text x="827.5" y="842" font-size="12" text-anchor="middle" fill="#53697e">legacy</text><path d="M640,905 L640,960" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="596" y="910.5" width="88" height="20" fill="white" rx="3"/><text x="640" y="924.5" font-size="12" text-anchor="middle" fill="#53697e">active</text><path d="M640,1070 L640,1125" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M470,1180 L435,1180 L435,1180 L400,1180" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="434.5" y="1158" width="36" height="20" fill="white" rx="3"/><text x="452.5" y="1172" font-size="12" text-anchor="middle" fill="#53697e">失败</text><path d="M640,1235 L640,1290" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="609" y="1240.5" width="62" height="20" fill="white" rx="3"/><text x="640" y="1254.5" font-size="12" text-anchor="middle" fill="#53697e">取得租约</text><path d="M640,1400 L640,1455" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M810,1345 L845,1345 L845,1510 L880,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="803" y="1323" width="49" height="20" fill="white" rx="3"/><text x="827.5" y="1337" font-size="12" text-anchor="middle" fill="#53697e">不可靠</text><path d="M810,1510 L845,1510 L845,1510 L880,1510" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="777" y="1488" width="101" height="20" fill="white" rx="3"/><text x="827.5" y="1502" font-size="12" text-anchor="middle" fill="#53697e">不确定/无权限</text><path d="M640,1565 L640,1620" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="609" y="1570.5" width="62" height="20" fill="white" rx="3"/><text x="640" y="1584.5" font-size="12" text-anchor="middle" fill="#53697e">允许继续</text><path d="M810,1675 L845,1675 L845,1840 L880,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="796.5" y="1653" width="62" height="20" fill="white" rx="3"/><text x="827.5" y="1667" font-size="12" text-anchor="middle" fill="#53697e">辅助动作</text><path d="M640,1730 L640,1785" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="602.5" y="1735.5" width="75" height="20" fill="white" rx="3"/><text x="640" y="1749.5" font-size="12" text-anchor="middle" fill="#53697e">查询类动作</text><path d="M640,1895 L640,1950" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M640,2060 L640,2115" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M640,2225 L640,2280" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="628.5" y="2230.5" width="23" height="20" fill="white" rx="3"/><text x="640" y="2244.5" font-size="12" text-anchor="middle" fill="#53697e">是</text><path d="M470,2170 L442,2170 L442,2500 L470,2500" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="444.5" y="2148" width="23" height="20" fill="white" rx="3"/><text x="456" y="2162" font-size="12" text-anchor="middle" fill="#53697e">否</text><path d="M640,2390 L640,2445" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M880,1840 L845,1840 L845,2500 L810,2500" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M880,1510 L845,1510 L845,2500 L810,2500" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M640,2555 L640,2610" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="615.5" y="2560.5" width="49" height="20" fill="white" rx="3"/><text x="640" y="2574.5" font-size="12" text-anchor="middle" fill="#53697e">有清单</text><path d="M640,2720 L640,2775" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M640,2885 L640,2940" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><path d="M400,355 L435,355 L435,1840 L470,1840" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="367" y="333" width="101" height="20" fill="white" rx="3"/><text x="417.5" y="347" font-size="12" text-anchor="middle" fill="#53697e">报表选择/预览</text><path d="M400,355 L435,355 L435,2335 L470,2335" fill="none" stroke="#657891" stroke-width="1.7" marker-end="url(#arrow0)"/><rect x="367" y="333" width="101" height="20" fill="white" rx="3"/><text x="417.5" y="347" font-size="12" text-anchor="middle" fill="#53697e">从固定预览建单</text><rect x="470" y="135" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户输入自然语言</text><text x="640" y="205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">Vue AgentChat.send</text><rect x="60" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="230" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">表格和卡片按钮</text><text x="230" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">结构化 REST；不经过模型</text><rect x="470" y="300" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">POST /api/agent/chat</text><text x="640" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">message + conversationId</text><text x="640" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">previewId + excludedRecords</text><polygon points="640,465 810,520 640,575 470,520" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="505" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">CORS → 会话认证</text><text x="640" y="525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">Bearer token → 数据库身份</text><text x="640" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">覆盖客户端 X-User-Id</text><rect x="880" y="465" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="515" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">身份失效：拒绝请求</text><text x="1050" y="535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">HTTP 401；不解析语义</text><polygon points="640,630 810,685 640,740 470,685" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="680" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">检查非空与长度</text><text x="640" y="700" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">trim；最多 2000 字符</text><rect x="880" y="630" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">输入不合法</text><text x="1050" y="690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">REST JSON 业务错误码 400</text><text x="1050" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">尚未进入语义解析</text><polygon points="640,795 810,850 640,905 470,850" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="845" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">agent.semantic.mode？</text><text x="640" y="865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">当前 active</text><rect x="880" y="795" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="1050" y="835" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">legacy 兼容模式</text><text x="1050" y="855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">ChatClient + 记忆 + 工具</text><text x="1050" y="875" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不是当前主路径或失败兜底</text><rect x="470" y="960" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SemanticConversationService</text><text x="640" y="1020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">新建或验证会话归属</text><text x="640" y="1040" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">检查历史数据可读性</text><rect x="470" y="1125" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">配额 + 对话租约</text><text x="640" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">同会话串行；读取状态</text><text x="640" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">本轮 requestId/previewVersion</text><rect x="60" y="1125" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="230" y="1165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">配额或会话租约失败</text><text x="230" y="1185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">限流/依赖异常/同会话忙</text><text x="230" y="1205" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">外层 SSE error + done</text><rect x="470" y="1290" width="340" height="110" rx="12" fill="#f3edff" stroke="#8751bf" stroke-width="1.5"/><text x="640" y="1330" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">解析本轮结构化语义</text><text x="640" y="1350" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">保护实体；模型输出 V2 JSON</text><text x="640" y="1370" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">详见第 02 页</text><rect x="470" y="1455" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="640" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">校验并合并范围</text><text x="640" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">公司 / 报表 / 排除项</text><text x="640" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">详见第 03、04 页</text><rect x="880" y="1455" width="340" height="110" rx="12" fill="#fff0ef" stroke="#ba534e" stroke-width="1.5"/><text x="1050" y="1495" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">澄清 / 拒绝 / 失败</text><text x="1050" y="1515" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">记录 unresolved 和原因</text><text x="1050" y="1535" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">不回落旧范围执行业务</text><polygon points="640,1620 810,1675 640,1730 470,1675" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="1670" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">是哪一种 action？</text><text x="640" y="1690" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">查询 / 建单 / 解释规则</text><rect x="880" y="1785" width="340" height="110" rx="12" fill="#edf5ff" stroke="#3778a8" stroke-width="1.5"/><text x="1050" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">HELP / CANCEL_PLAN / SHOW_RESULT</text><text x="1050" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">服务端帮助、取消或读结果</text><text x="1050" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">均不执行实际派单</text><rect x="470" y="1785" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="1825" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">确定性查询流程</text><text x="640" y="1845" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">权限 + 当前目录/规则版本</text><text x="640" y="1865" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">MCP report_records → 业务库</text><rect x="470" y="1950" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="1990" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">复用或生成预览</text><text x="640" y="2010" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">本地规则求值；预览持久化</text><text x="640" y="2030" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">排除项与预览绑定</text><polygon points="640,2115 810,2170 640,2225 470,2170" fill="#fff4dc" stroke="#b58022" stroke-width="1.5"/><text x="640" y="2165" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">PREPARE_DISPATCH？</text><text x="640" y="2185" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">有效范围和排除项已确认</text><rect x="470" y="2280" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="2320" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">创建 PENDING 清单</text><text x="640" y="2340" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">语义幂等键 semantic:requestId</text><text x="640" y="2360" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">没有调用 dispatch_submit</text><rect x="470" y="2445" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="2485" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">SSE / REST 返回前端</text><text x="640" y="2505" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">自然语言：事实文本和卡片事件</text><text x="640" y="2525" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">按钮：结构化 JSON 结果</text><rect x="470" y="2610" width="340" height="110" rx="12" fill="#eaf2ff" stroke="#386bc1" stroke-width="1.5"/><text x="640" y="2660" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">用户核对并点击确认</text><text x="640" y="2680" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">POST /dispatch/plans/{id}/confirm</text><rect x="470" y="2775" width="340" height="110" rx="12" fill="#e8f7ef" stroke="#268255" stroke-width="1.5"/><text x="640" y="2815" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">归属/版本/TTL/CAS 复核</text><text x="640" y="2835" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">逐条提交 MCP dispatch_submit</text><text x="640" y="2855" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">详见第 06 页</text><rect x="470" y="2940" width="340" height="110" rx="12" fill="#edf1f5" stroke="#60768b" stroke-width="1.5"/><text x="640" y="2980" text-anchor="middle" font-size="15" font-weight="700" fill="#1e354c">结果保存与展示</text><text x="640" y="3000" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">SUCCESS / FAILED / SKIPPED</text><text x="640" y="3020" text-anchor="middle" font-size="13" font-weight="400" fill="#1e354c">UNKNOWN → REVIEW_REQUIRED</text><text x="60" y="3079" font-size="12" fill="#64748b">2026-09-30 · 依据当前工作区源码 · 模型解析 / 确定性业务 / 实际派单边界分离</text></g></svg>