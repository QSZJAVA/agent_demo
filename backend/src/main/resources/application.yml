server:
  port: 8080

spring:
  application:
    name: report-demo

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 会自动创建 report_demo 库，无需手工建库
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/report_demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 本地密码通过环境变量或 tools/env.local.cmd 提供，切勿把真实密码写进本文件并提交
    password: ${DB_PASSWORD:}

  jdbc:
    template:
      # 单条报表查询的上限；整个异步预览任务另有 120 秒超时。
      query-timeout: 60s

  # 表结构由 Flyway 版本化迁移维护（classpath:db/migration）。已有库第一次接入时以版本 0 建立基线，
  # V1 全部 IF NOT EXISTS 只补缺失的表，之后 V2+ 把规则、审计迁移到报表目录 / report_id 模型
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 无密码时留空；真实密码走环境变量，不要写进本文件
      password: ${REDIS_PASSWORD:}

  mvc:
    async:
      # SSE 对话最长等待时间（毫秒）
      request-timeout: 300000

  ai:
    model:
      # 只用对话模型；其余 OpenAI 模型不装配，否则它们在启动时也会强制要求 API Key
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    retry:
      # 鉴权 / 参数错误不重试，避免 Key 配错时前端长时间等待
      max-attempts: 3
      exclude-on-http-codes: 400,401,403,404
    openai:
      # 自建 OpenAI 兼容站点默认值；直连 DeepSeek 官方改为 https://api.deepseek.com
      # 换回阿里云百炼：https://dashscope.aliyuncs.com/compatible-mode，并把 extra-body 换成 enable_thinking: false
      # base-url 不要带 /v1（completions-path 已含），否则会拼成 /v1/v1/... 报 404
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 密钥只从环境变量读取，严禁把真实 Key 写进本文件并提交
      api-key: ${LLM_API_KEY:}
      chat:
        completions-path: /v1/chat/completions
        options:
          # 可换站点上的其他模型名，只改这一行
          model: ${LLM_MODEL:deepseek-v4.1-flash}
          temperature: 0.1
          stream-usage: true
          extra-body:
            thinking:
              type: disabled

web:
  # 允许跨域访问 /api 的来源，逗号分隔，例如 https://demo.example.com。
  # 开发（Vite 代理）与 Docker（Nginx 反代）都是同源访问，默认留空即不开放跨域
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

demo:
  # 每次启动把报表演示数据、报表目录、派单规则恢复为示例状态（db/demo/demo-data.sql），便于反复演示和跑集成测试。
  # 生产环境必须设为 false：报表业务表属于业务系统，目录和规则由管理员维护，不能在重启时被覆盖
  reset-on-startup: ${DEMO_RESET_ON_STARTUP:true}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

agent:
  llm:
    # true 时使用本地关键词模拟模型（无需 API Key），配合 --spring.profiles.active=mock 使用
    mock: false
  dispatch:
    require-confirm: true             # 派单前弹确认卡片；业务接受时可关闭
  preview:
    ttl-minutes: 30
    max-items: 5000                   # 单次预览记录上限；超出时要求缩小范围（分页在 P1 实现），不静默截断
  plan:
    ttl-minutes: 10
  resolver:
    fuzzy-threshold: 0.6              # 模糊匹配最低得分（0~1）
    ambiguity-margin: 0.15            # 第一名领先第二名不足该分差时视为歧义，让用户选择
  memory:
    ttl-minutes: 30
    window-size: 20                   # Redis 工作记忆窗口，过期后从消息表回灌
  conversation:
    retention-days: 365               # 对话日志保留期
    card-payload-max-rows: 2000       # 卡片载荷持久化行数上限，超出只存摘要
    title-max-length: 30              # 默认标题取首条用户消息前 N 字

logging:
  pattern:
    # 日志带请求链路号，审计记录里的 trace_id 可以直接反查当次请求的日志
    level: "%5p [%X{traceId:-}]"
  level:
    com.example.report: info
